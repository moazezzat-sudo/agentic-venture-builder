services:
  # Fallback local model server, for people with nothing installed. If Ollama already
  # runs natively (for example Ollama for Windows with a GPU), set
  # OLLAMA_BASE_URL=http://host.docker.internal:11434 in .env and start only the app:
  #   docker compose up --no-deps app
  # No host port is published, so this never clashes with a native Ollama on 11434.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Downloads the open-weight model(s) once (kept in the ollama_data volume), in the
  # background: the app does not wait for it. Choose the model with OLLAMA_MODEL in .env
  # (default qwen3:8b, about 5 GB; qwen3:4b is about half for slow connections).
  # Progress: docker compose logs -f model-pull
  model-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint:
      - sh
      - -c
      - ollama pull ${OLLAMA_MODEL:-qwen3:8b} && if [ -n "${OLLAMA_FAST_MODEL:-}" ]; then ollama pull ${OLLAMA_FAST_MODEL:-}; fi
    restart: "no"

  app:
    build: .
    working_dir: /workspace
    volumes:
      - ./outputs:/workspace/outputs
      # The repository folder, so decision_log.json is written to the repo root on the
      # host and survives the container (a single-file mount breaks the logger's atomic write).
      - .:/repo
    env_file:
      - path: .env
        required: false
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
      - OLLAMA_FAST_MODEL=${OLLAMA_FAST_MODEL:-}
      - DECISION_LOG_PATH=/repo/decision_log.json
    extra_hosts:
      # Lets http://host.docker.internal reach a native Ollama on Linux too (built in on Windows/Mac).
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    # The app starts as soon as the ollama container has started; it never waits for the
    # model download. model-pull keeps downloading in the background and the app shows
    # "Local model still downloading" until the model is there (a Groq key works at once).
    # required: false lets the app start even when the ollama service is stopped or fails.
    depends_on:
      ollama:
        condition: service_started
        required: false
    # The founder web app on http://localhost:8000
    command: streamlit run app.py --server.port 8000 --server.address 0.0.0.0

volumes:
  ollama_data:
