services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Downloads the open-weight model once (kept in the ollama_data volume).
  model-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen3:8b}"]
    restart: "no"

  app:
    build: .
    working_dir: /workspace
    volumes:
      - ./outputs:/workspace/outputs
    env_file:
      - path: .env
        required: false
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
    ports:
      - "8000:8000"
    depends_on:
      model-pull:
        condition: service_completed_successfully
    # Placeholder until the web app (app.py) lands: runs the smoke tests, then serves on port 8000.
    command: sh -c "python -m pytest -q tests && python -m http.server 8000"

volumes:
  ollama_data:
